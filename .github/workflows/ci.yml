name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: 前端(静态导出 + 测试)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: 安装依赖
        run: bun install --frozen-lockfile
      - name: 构建验证(Next.js 静态导出)
        run: bun run build
      - name: 单元测试(vitest)
        run: bun run test

  rust:
    name: Rust(fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  audit:
    name: 依赖漏洞扫描
    runs-on: ubuntu-latest
    # 初期告警不阻断(设计文档 §10/§11.3),出现高危项后再转为强制
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        # --config picks up audit.toml in repo root, which ignores
        # RUSTSEC-2023-0071 (rsa / Marvin Attack) with justification in
        # CHANGELOG.md Unreleased / Security.
        run: cargo audit --file src-tauri/Cargo.lock --config audit.toml
