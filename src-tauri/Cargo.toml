[package]
name = "shelx"
version = "0.4.3"
description = "shelx - lightweight SSH / SFTP / server-monitor desktop tool"
authors = ["esyion"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shelx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Tauri 框架与插件 ---
# tray-icon:系统托盘(关闭最小化到托盘时保活 SSH 会话的回到入口)。
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
# 系统剪贴板:WKWebView 拒绝 Web Clipboard API(NotAllowedError),
# 终端选中即复制/右键粘贴/OSC 52 统一经原生插件读写。
# 精确钉版:crate 与 npm @tauri-apps/plugin-clipboard-manager 必须
# 同版本,否则 tauri dev 报 Tauri packages 版本不匹配;升级时两侧同步。
tauri-plugin-clipboard-manager = "=2.3.3"
# 应用内更新:GitHub Releases endpoint + minisign 签名校验。
# 公钥见 src-tauri/keys/minisign.pub(随仓库发布);私钥经 GitHub Secret 注入 CI。
# 关闭默认 zip feature:实际更新包(macOS tar.gz / Windows NSIS exe / Linux AppImage·deb)
# 均不经 zip 解压;zip 4.x 有 RUSTSEC-2026-0367~0369,updater 2.x 仍锁 zip ^4
# (上游 v2 分支已改用 zip 9,尚未发版)。回滚:去掉 default-features/features 即可。
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
# 记住窗口大小/位置/最大化状态:注册即自动在退出时保存、建窗时恢复。
# 回滚:删除本依赖与 lib.rs 注册行即可,窗口回到 tauri.conf.json 的固定几何。
tauri-plugin-window-state = "2"
# 单实例:二次启动(含双击 ssh:// 链接拉起的新进程)不再开新窗口,
# 而是把已有主窗口带回前台;回调必须注册为第一个插件。
# 回滚:删除本依赖与 lib.rs 注册行即可恢复多开行为。
tauri-plugin-single-instance = "2"
# 开机自启:设置项驱动,启动期收敛注册表与设置文件的一致性。
# dev 构建跳过注册表写入(避免 dev/安装版互相覆写自启指向)。
# 回滚:删除本依赖、lib.rs 注册行与 window_integration 同步逻辑即可。
tauri-plugin-autostart = "2"
# 全局快捷键:任意界面唤起主窗口;档位枚举进设置契约,无自由文本输入。
# 回滚:删除本依赖、lib.rs 注册行与 window_integration 的快捷键同步即可。
tauri-plugin-global-shortcut = "2"
# 系统通知:窗口不在前台时提醒传输完成/连接断开;crate 与 npm
# @tauri-apps/plugin-notification 保持 2.x 对齐。
# 回滚:删除本依赖、lib.rs 注册行、capability 与 services/notify.ts 即可。
tauri-plugin-notification = "2"
# ssh:// 协议深链:浏览器/文档点击链接直达快速连接(解析在 Rust,事件交前端)。
# Windows/Linux 运行时注册协议关联,macOS 经 tauri.conf.json 写入 Info.plist。
# 回滚:删除本依赖、注册行、deep_link 适配器与配置里的 schemes 即可。
tauri-plugin-deep-link = "2"

# --- 序列化与配置(JSON)---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# --- SSH / SFTP(PRD §7.1)---
# 加密后端用 ring:aws-lc-rs 默认后端在 Windows 构建需要 NASM/CMake;
# 保留 flate2(zlib 压缩)与 rsa(老服务器 ssh-rsa 兼容)。
russh = { version = "0.63.3", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "sync", "io-util", "process"] }
# ↑ process feature:Agent 本机工作区的 local_exec 用 tokio::process 起系统 shell
#   (用途:spawn 子进程 + 双流收集 + 超时 kill/kill_on_drop)。
#   风险:任意命令执行的暴露面 —— 由逐次审批门、cwd 固定工作区、超时与输出上限约束。
#   回滚:去掉 feature 并删除 infrastructure/local_exec.rs 与 local_ops 分支即可。

# --- 本地存储与凭据(PRD §7.1)---
rusqlite = { version = "0.40.2", features = ["bundled"] }
keyring = "4.2.0"
# 钥匙串不可用时的降级加密(设计文档 §7.4):机器指纹派生 AES-GCM 密钥
machine-uid = "0.6"
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"

# --- 系统对话框(私钥文件 / 下载目录选择,PRD §6.2)---
tauri-plugin-dialog = "2"

# --- 日志与路径(设计文档 §7.1 / §7.5)---
tracing = "0.1"
# `time` feature 启用 OffsetTime timer(时间戳用本地时区输出)。
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
tracing-appender = "0.2"
# 用途:启动时捕获本机 UTC 偏移,日志时间戳按用户本地时区输出(见 shared/logging.rs)。
# 风险:`local-offset` 在部分平台多线程下可能检测失败,代码中已回退 UTC。
# 回滚:去掉本依赖与 tracing-subscriber 的 `time` feature,时间戳退回默认 UTC 输出。
time = { version = "0.3", default-features = false, features = ["formatting", "local-offset"] }
dirs = "6"

# --- ID 生成(跨 IPC/持久化统一 string,AGENTS.md §5)---
uuid = { version = "1", features = ["v4"] }
# --- 应用层 async 端口 trait 对象安全(async fn in trait 的 dyn 形态)---
async-trait = "0.1"
# --- IPC 契约代码生成(AGENTS.md §5)---
# 用途:从 Rust DTO 导出 JSON Schema,前端据此生成 TS 类型,消除手写镜像漂移。
# 只在契约导出用例与 `get_ipc_schema` 中调用,不参与业务运行时逻辑。
# 回滚:删除本依赖 + `cargo remove` 后移除各类型的 `schemars::JsonSchema` derive 与
# src-tauri/contract/ 生成物即可,前端退回手写类型。
schemars = "1.2.3"
# --- AI Agent(M5,docs/AGENT_DESIGN.md)---
# 用途:Agent 循环、Responses/Messages 协议与工具调用。开除外部数据库外的全部能力:内容
#       (audio/image/pdf/epub)、memory(会话/记忆存储)、本地 embedding 与推理(candle/fastembed)、
#       边缘向量(vectorize)、provider 补充(bedrock/gemini-grpc/vertexai/typesafeai)、
#       MCP 客户端(rmcp)、cassette 录制回放与网络选项(websocket/socks/reqwest-middleware)。
#       数据库只有 sqlite:不开任何 rig 外部数据库/向量库集成(lancedb/milvus/mongodb/neo4j/
#       qdrant/s3vectors/scylladb/surrealdb/helixdb/postgres)——项目用不上,且 postgres 经 sqlx
#       会拉 sqlx-sqlite、sqlite 经 rig-sqlite 会拉 rusqlite ^0.32,都与本项目 rusqlite 0.40.2
#       在 libsqlite3-sys(links="sqlite3" 全图仅允许一份)上原生冲突。
#       rig-sqlite(向量存储)已决策不引入(2026-10-30):等价能力由 infrastructure/vector 防腐层
#       以 rusqlite 0.40 自实现(精确余弦 top-N + rig VectorStore 契约,迁移 0010),保住 SQLite 3.50 引擎。
#       原设计中"向量库/embedding/MCP 为非目标"不再成立,AGENT_DESIGN 待同步。
# 风险:编译时间、二进制体积与依赖供应链面显著变大(candle/fastembed 拉 ort 等 native 依赖,
#       fastembed 构建期会下载 ONNX 二进制);未使用的特性只增加体积,不影响运行时行为。
# 精确锁版 `=0.45.0`:rig 为 0.x,每版可能破坏 API(CHANGELOG 大量 breaking);升级必须独立提交,
#       改动面按防腐层压在 infrastructure/agent/{provider,rig_bridge}.rs 两处。
# TLS 选 native-tls 而非默认 rustls:rustls 经 reqwest 会拉进 aws-lc-rs,Windows 构建需 NASM/CMake
#       (与上面 russh 选 ring 的理由一致);native-tls 在 Windows=Schannel、macOS=SecurityFramework、
#       Linux 需 libssl-dev。全量特性下仍保持单一 TLS 栈:rustls/websocket-rustls/
#       reqwest-middleware-rustls 与 test-utils/facade-build-tests 不开。
# 回滚:`cargo remove rig` + 删除 src-tauri/src/{domain,application,infrastructure}/agent*、
#       commands/agent.rs、dto/agent.rs、migrations/0002_agent.sql 与前端 /agent 路由即可,核心 SSH 功能不受影响。
rig = { version = "=0.45.0", default-features = false, features = [
  "agent", "derive", "reqwest", "native-tls",
  "audio", "image", "pdf", "epub",
  "memory", "cassette", "rmcp",
  "websocket-native-tls", "socks", "reqwest-middleware-native-tls",
  "bedrock", "gemini-grpc", "vertexai", "typesafeai",
  "candle", "fastembed", "vectorize",
] }
# --- 离线 embedding(infrastructure/semantic.rs 直接用 fastembed 的 TextEmbedding)---
# 用途:rig 的 Fastembed 封装不暴露模型文件定制,这里直接依赖 fastembed(与
#       rig-fastembed 同一 4.9.x,自动统一版本);模型文件随安装包 resources 内置
#       (src-tauri/resources/embeddings/,Q8 量化约 24 MB),不走 HuggingFace 下载。
# 风险:安装包体积 +约 24 MB;CPU 推理在 blocking 线程池执行;换模型文件必须清空
#       向量表重建(维度与语义空间不同)。
# 回滚:`cargo remove fastembed` + 删除 infrastructure/semantic.rs 与 semantic 相关
#       application/commands 代码即可,向量表(0010)可留在库里不影响运行。
fastembed = "4.9.1"
futures = "0.3"

[dev-dependencies]
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
