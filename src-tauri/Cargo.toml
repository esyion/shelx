[package]
name = "shelx"
version = "0.2.10"
description = "shelx - lightweight SSH / SFTP / server-monitor desktop tool"
authors = ["esyion"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shelx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Tauri 框架与插件 ---
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
# 应用内更新:GitHub Releases endpoint + minisign 签名校验。
# 公钥见 src-tauri/keys/minisign.pub(随仓库发布);私钥经 GitHub Secret 注入 CI。
tauri-plugin-updater = "2"

# --- 序列化与配置(JSON)---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# --- SSH / SFTP(PRD §7.1)---
# 加密后端用 ring:aws-lc-rs 默认后端在 Windows 构建需要 NASM/CMake;
# 保留 flate2(zlib 压缩)与 rsa(老服务器 ssh-rsa 兼容)。
russh = { version = "0.63.3", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "sync", "io-util"] }

# --- 本地存储与凭据(PRD §7.1)---
rusqlite = { version = "0.40.2", features = ["bundled"] }
keyring = "4.2.0"
# 钥匙串不可用时的降级加密(设计文档 §7.4):机器指纹派生 AES-GCM 密钥
machine-uid = "0.6"
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"

# --- 系统对话框(私钥文件 / 下载目录选择,PRD §6.2)---
tauri-plugin-dialog = "2"

# --- 日志与路径(设计文档 §7.1 / §7.5)---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
dirs = "6"

# --- ID 生成(跨 IPC/持久化统一 string,AGENTS.md §5)---
uuid = { version = "1", features = ["v4"] }
# --- 应用层 async 端口 trait 对象安全(async fn in trait 的 dyn 形态)---
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
