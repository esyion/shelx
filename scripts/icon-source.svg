<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Tauri 平台图标源(只用于生成 src-tauri/icons/*)。
    仅包含 > 和竖条(终端提示符 + 光标),不带 shelx 文字 —— 任务栏/Dock/资源管理器
    在 16-32px 尺寸下文字不可读。wordmark 全版保留在 public/shelx.svg 供 web 用。

    实现:外层 512x512 黑色背景,内嵌一个 256x110 的子 SVG(用原 viewBox 0 0 148 47
    把 > 和竖条按比例缩放到 256 宽并紧贴在一起,中间 14 留白),整体居中。
      scale = 256 / (14.4 + 14 + gap) 取 gap=14 → scale = 256 / 42.4 ≈ 6.0377
      子 svg x = (512 - 256)/2 = 128
      子 svg height = 47 * 6.0377 ≈ 283.77 → 取 284
      子 svg y = (512 - 284)/2 = 114
    在子 svg viewBox 0 0 34.4 47 下:
      > 平移到 x=0,保持原 y(16.2..33.7)不变;
      | 平移到 x=14.4 + 6 = 20.4,gap=6(更紧贴),y = (47 - 28)/2 = 9.5(原 viewBox 中心)。
      子 svg height = 47 * 7.4419 ≈ 349.8 → 取 350
      子 svg y = (512 - 350)/2 = 81
  -->
  <rect width="512" height="512" fill="#0A0A0A"/>
  <svg x="128" y="81" width="256" height="350" viewBox="-2.4 0 36.8 47">
    <path d="M2.432 33.708V30.028L11.712 25.74C12.1387 25.548 12.5547 25.388 12.96 25.26C13.3867 25.1107 13.7173 25.0147 13.952 24.972C13.7173 24.9293 13.3867 24.8547 12.96 24.748C12.5333 24.62 12.1173 24.46 11.712 24.268L2.432 19.948V16.204L16.768 22.956V26.956L2.432 33.708Z" fill="#00FF66"/>
    <rect x="20.4" y="9.5" width="14" height="28" rx="1" fill="#00FF66"/>
  </svg>
</svg>